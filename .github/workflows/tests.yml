name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# One run per branch. Pushing twice in a minute used to leave the first run
# grinding through a full suite for a commit nobody is waiting on any more —
# except on main, where every commit's result is the record of that commit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    # The suite talks to a real Postgres — phpunit.xml pins the connection to
    # pgsql, and the parallel runner clones this database once per worker, so
    # the named one has to be there before anything runs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postduif_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: postduif_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          # pcntl and posix are Horizon's own hard requirements, so composer
          # install refuses without them rather than failing later.
          extensions: pdo_pgsql, pgsql, pcntl, posix
          tools: composer:v2
          coverage: none

      # Ghostscript, because the contract suite is not really testing anything
      # without it: NormalisePdf shells out to it on every upload, and the tests
      # that exercise that path skip themselves when the binary is missing. A
      # green run would then be saying nothing about the half of the feature
      # most likely to break on a server.
      #
      # Installed rather than assumed: the runner image happens to carry it
      # today, and a green suite that quietly depends on that is exactly the
      # kind of thing that goes red on an image update nobody here chose.
      - name: Install Ghostscript
        run: sudo apt-get install -y --no-install-recommends ghostscript

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # The action's own cache of ~/.npm, keyed on package-lock.json. The
          # npm install inside "composer setup" below is what draws on it.
          cache: npm

      # The same for Composer's download cache. Not vendor/ itself: a cached
      # vendor directory is a half-installed one the moment a dependency
      # changes, while the download cache only ever saves a fetch.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
