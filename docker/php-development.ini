; The source comes from a bind mount here, so opcache has to notice that a file
; changed — otherwise editing a controller does nothing until the container is
; restarted, which is exactly the thing bind mounts are for.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

display_errors = On
display_startup_errors = On
