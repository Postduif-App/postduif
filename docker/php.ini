; Settings shared by every shape of the image. The per-environment opcache
; settings live beside this file, in php-development.ini and php-production.ini.

memory_limit = 512M

; A workspace may allow transfers of up to 2 GB per file (see the default on
; workspaces.max_transfer_kb). PHP has to be willing to accept what the
; validator is willing to allow, otherwise the upload is refused before the
; rule that governs it is ever consulted.
upload_max_filesize = 2048M
post_max_size = 2048M
max_file_uploads = 30

; Uploads of that size take a while over a slow line. The web request itself
; does almost nothing once the body has arrived.
max_execution_time = 300
max_input_time = 300

expose_php = Off

; The image logs to stdout so `docker compose logs` shows what the app knows.
log_errors = On
error_log = /dev/stderr
display_errors = Off
