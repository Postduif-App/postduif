<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Postduif">
  <!--
    The mark from the huisstijl: a dove in profile on ink.

    Yellow on ink rather than the other way round, and never yellow on white —
    that combination is called out as too low-contrast. An ink tile also means
    the icon carries its own background, so it holds up in a light tab strip and
    a dark one without a second file or a prefers-color-scheme guess.

    Radius 10 on a 48 box is the same proportion the huisstijl draws at 80/17.
  -->
  <rect width="48" height="48" rx="10" fill="#16160F"/>
  <!--
    Centred by the ink rather than by the viewBox: the two paths span x 1.5-45.6
    and y 6.6-35.4, so a plain translate leaves the bird sitting high and left.
  -->
  <g transform="translate(8.29 9.99) scale(0.667)" fill="#E8C81E">
    <path d="M21 23.6L1.5 21.4L19.5 32Z"/>
    <path d="M30.5 7.6C35.6 6.6 39.6 10 39.6 14L45.6 14.6L39 18.2C42 22 42.2 30 35.8 33.4C30.2 36.4 22.4 35.4 18.8 31.6C15.6 28.2 18.6 21.4 25.6 18.6C26 13.2 27 9 30.5 7.6Z"/>
  </g>
</svg>
