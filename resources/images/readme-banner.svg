<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Postduif — team messaging for workspaces">
  <!--
    The README header. Same arrangement as og.svg — yellow dove on ink over the
    grid — but shorter, and with the wordmark set rather than left to the reader.

    Ink carries its own background, so the one file reads on GitHub's light
    theme and its dark one; a <picture> with two sources would buy nothing here.
  -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#F7F6F1" stroke-width="1" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" fill="#16160F"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!--
    Centred by the ink the bird actually covers: the two paths span x 1.5-45.6
    and y 6.6-35.4, so a plain translate would leave it sitting high and left.
  -->
  <g fill="#E8C81E" transform="translate(505.8 26) scale(4)">
    <path d="M21 23.6L1.5 21.4L19.5 32Z"/>
    <path d="M30.5 7.6C35.6 6.6 39.6 10 39.6 14L45.6 14.6L39 18.2C42 22 42.2 30 35.8 33.4C30.2 36.4 22.4 35.4 18.8 31.6C15.6 28.2 18.6 21.4 25.6 18.6C26 13.2 27 9 30.5 7.6Z"/>
  </g>

  <!-- Lowercase is the huisstijl rule, not a stylistic accident. -->
  <text x="600" y="230" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="72" font-weight="600" letter-spacing="-3.2" fill="#F7F6F1">postduif</text>

  <text x="600" y="276" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="21" letter-spacing="1.2" fill="#F7F6F1" opacity="0.5">channels · threads · tickets · presence — self-hosted</text>

  <rect x="552" y="304" width="96" height="3" rx="1.5" fill="#E8C81E"/>
</svg>
